name: openIMIS Playwright CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Public demo defaults — override in your fork's secrets if you need a
  # private instance. Tests skip gracefully when the DB is unreachable.
  OPENIMIS_BASE_URL: https://demo.openimis.org
  OPENIMIS_API_BASE_URL: https://demo.openimis.org/api
  OPENIMIS_USERNAME: Admin
  OPENIMIS_PASSWORD: admin123
  PG_DATABASE: test_imis
  PG_USER: IMISuser
  PG_PASSWORD: IMISuser@1234

jobs:
  ui-tests:
    name: UI tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        run: npx tsc --noEmit
      - name: Run UI tests
        run: npx playwright test tests/ui --reporter=list,junit
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: playwright-report
          retention-days: 14

  api-tests:
    name: API tests (GraphQL + REST + FHIR)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx tsc --noEmit
      - name: Run API tests
        run: npx playwright test tests/api --reporter=list,junit
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report
          retention-days: 14

  db-tests:
    name: Database tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Spin up openIMIS' official Postgres image for the DB tests.
    services:
      postgres:
        image: ghcr.io/openimis/openimis-pgsql:develop
        env:
          POSTGRES_DB: test_imis
          POSTGRES_USER: IMISuser
          POSTGRES_PASSWORD: IMISuser@1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U IMISuser -d test_imis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_DATABASE: test_imis
      PG_USER: IMISuser
      PG_PASSWORD: IMISuser@1234
      PG_SSL: 'false'
      OPENIMIS_BASE_URL: https://demo.openimis.org
      OPENIMIS_API_BASE_URL: https://demo.openimis.org/api
      OPENIMIS_USERNAME: Admin
      OPENIMIS_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx tsc --noEmit
      - name: Run DB tests
        run: npx playwright test tests/database --reporter=list,junit
        # The IMIS Postgres image ships WITHOUT a populated schema. The
        # DB tests skip gracefully when tables don't exist — this is
        # expected behaviour for the default image. For a full run,
        # provide a fully-migrated IMIS DB as a service instead.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-db
          path: playwright-report
          retention-days: 14

  integration-tests:
    name: Integration tests (UI + API + DB)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_DATABASE: test_imis
      PG_USER: IMISuser
      PG_PASSWORD: IMISuser@1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx tsc --noEmit
      - name: Run integration tests
        run: npx playwright test tests/integration --reporter=list,junit
        continue-on-error: true  # many tests skip when DB unreachable
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: playwright-report
          retention-days: 14
